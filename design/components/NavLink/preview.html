<!doctype html>
<html>
<head><meta charset="utf-8"><title>NavLink preview</title></head>
<body>
<div id="root"></div>
<script>
var G = window.Graphpaper, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(
  h(G.GraphPaper, { className: 'gp-stage' },
    h('div', { className: 'gp-row', style: { gap: 2 } },
      h(G.NavLink, { href: '#' }, 'Work'),
      h(G.NavLink, { href: '#', current: true }, 'Pricing'),
      h(G.NavLink, { href: '#' }, 'Docs'),
      h(G.NavLink, { href: '#' }, 'Sign in'))));
</script>
</body>
</html>
