<!doctype html>
<html>
<head><meta charset="utf-8"><title>SplitHeadline preview</title></head>
<body>
<div id="root"></div>
<script>
var G = window.Graphpaper, h = React.createElement;
function Demo() {
  var s = React.useState(false);
  return h(G.GraphPaper, { className: 'gp-stage', style: { display: 'grid', gap: 64.8, padding: '28.8px 64.8px' } },
    h(G.SplitHeadline, { left: 'From Graph', right: 'to Tool', emphasis: s[0] ? 'right' : 'left',
      joiner: h(G.Toggle, { checked: s[0], onChange: s[1], label: 'Show the tool view' }) }),
    h(G.SplitHeadline, { left: 'Human Judgement', right: 'Machine Speed', joiner: '+', style: { justifyContent: 'flex-start', gap: 28.8 } }));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
