<!-- @dsCard group="Canvas" height=300 width=900 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>NodeCard preview</title></head>
<body>
<div id="root"></div>
<script>
var G = window.Graphpaper, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(
  h(G.GraphPaper, { className: 'gp-stage gp-row', style: { gap: 28.8, padding: 28.8 } },
    h(G.NodeCard, { type: 'Image', model: 'Diffusion 3', alt: 'Generated product shot', width: 180, height: 220 }),
    h(G.NodeCard, { type: 'Text', kind: 'text', width: 200, height: 120 }, 'A ceramic vase on a plinth, late sun from the right, soft shadow.')));
</script>
</body>
</html>
