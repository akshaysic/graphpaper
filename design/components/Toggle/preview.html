<!doctype html>
<html>
<head><meta charset="utf-8"><title>Toggle preview</title></head>
<body>
<div id="root"></div>
<script>
var G = window.Graphpaper, h = React.createElement;
function Demo() {
  var s = React.useState(false);
  return h('div', { className: 'gp-stage gp-row', style: { alignItems: 'center', gap: 28.8 } },
    h(G.Toggle, { checked: s[0], onChange: s[1], label: 'Show the tool view' }),
    h('span', { className: 'label muted' }, s[0] ? 'Tool view' : 'Graph view'));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
