<!doctype html>
<html>
<head><meta charset="utf-8"><title>ArrowButton preview</title></head>
<body>
<div id="root"></div>
<script>
var G = window.Graphpaper, h = React.createElement;
function Row(theme) {
  return h('div', { 'data-theme': theme, className: 'gp-stage gp-row', style: { background: 'var(--ground)', gap: 7.2 } },
    h(G.ArrowButton, { direction: 'prev' }), h(G.ArrowButton, { direction: 'next' }));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null, Row('light'), Row('dark')));
</script>
</body>
</html>
